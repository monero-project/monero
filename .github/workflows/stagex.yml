name: ci/gh-actions/stagex

on:
  push:
    paths:
      - 'contrib/depends/**'
      - 'contrib/stagex/**'
      - '!contrib/**.md'
      - 'external/**'
      - '.github/workflows/stagex.yml'
      - '**/Cargo.lock'
  pull_request:
    paths:
      - 'contrib/depends/**'
      - 'contrib/stagex/**'
      - '!contrib/**.md'
      - 'external/**'
      - '.github/workflows/stagex.yml'
      - '**/Cargo.lock'

jobs:
  cache-sources:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: restore depends sources cache
        id: cache
        uses: actions/cache/restore@v5
        with:
          path: stagex/depends-sources
          key: sources-${{ hashFiles('contrib/depends/packages/*') }}
      - name: download depends sources
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "stagex/depends-sources"
          make -C contrib/depends download SOURCES_PATH="${PWD}/stagex/depends-sources"
      - name: save depends sources cache
        uses: actions/cache/save@v5
        if: github.event_name != 'pull_request' && steps.cache.outputs.cache-hit != 'true'
        with:
          path: stagex/depends-sources
          key: ${{ steps.cache.outputs.cache-primary-key }}

  build-stagex:
    runs-on: ubuntu-24.04
    needs: [cache-sources]
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - target: "x86_64-linux-musl"
          - target: "aarch64-linux-musl"
          - target: "riscv64-linux-musl"
          - target: "x86_64-w64-mingw32"
          - target: "x86_64-unknown-freebsd"
          - target: "x86_64-apple-darwin"
          - target: "arm64-apple-darwin"
          - target: "aarch64-linux-android"

    name: ${{ matrix.toolchain.target }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive
      - name: depends sources cache
        uses: actions/cache/restore@v5
        with:
          path: stagex/depends-sources
          key: sources-${{ hashFiles('contrib/depends/packages/*') }}
      - name: build
        run: HOSTS="${{ matrix.toolchain.target }}" ./contrib/stagex/stagex-build
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.toolchain.target }}
          path: |
            stagex/build/*/output/${{ matrix.toolchain.target }}/*
            stagex/build/*/logs/${{ matrix.toolchain.target }}/*
            !stagex/build/latest

  bundle-logs:
    runs-on: ubuntu-24.04
    needs: [build-stagex]
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - name: print hashes
        run: |
          echo '```' >> $GITHUB_STEP_SUMMARY
          find **/output/ -type f -print0 | env LC_ALL=C sort -z | xargs -r0 sha256sum >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v7
        with:
          name: "logs"
          path: '**/logs/**'
