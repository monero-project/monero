[package]
name = "fcmp_pp_rust"
version = "0.0.0"
edition = "2021"

[lib]
name = "fcmp_pp_rust"
crate-type = ["staticlib"]

[dependencies]
rand_core = { version = "0.6", default-features = false, features = ["getrandom"] }

multiexp = { version = "0.5", default-features = false, features = ["batch"] }
ciphersuite = { version = "0.4.2", features = ["ed25519"] }
dalek-ff-group = "0.5.0"
helioselene = { git = "https://github.com/monero-oxide/monero-oxide", rev = "77788c368145127f2dde2ac3e2ddce919f3ddd01" }

generalized-bulletproofs = { git = "https://github.com/monero-oxide/monero-oxide", rev = "77788c368145127f2dde2ac3e2ddce919f3ddd01" }
ec-divisors = { git = "https://github.com/monero-oxide/monero-oxide", rev = "77788c368145127f2dde2ac3e2ddce919f3ddd01", features = ["ed25519"] }
full-chain-membership-proofs = { git = "https://github.com/monero-oxide/monero-oxide", rev = "77788c368145127f2dde2ac3e2ddce919f3ddd01" }

monero-fcmp-plus-plus-generators = { git = "https://github.com/monero-oxide/monero-oxide", rev = "77788c368145127f2dde2ac3e2ddce919f3ddd01" }
monero-fcmp-plus-plus = { git = "https://github.com/monero-oxide/monero-oxide", rev = "77788c368145127f2dde2ac3e2ddce919f3ddd01" }

[patch.crates-io]
crypto-bigint = { git = "https://github.com/kayabaNerve/crypto-bigint", branch = "c-repr" }

[profile.dev]
lto = "off"
panic = "abort"
overflow-checks = true

[profile.release]
lto = "thin"
panic = "abort"
overflow-checks = true
codegen-units = 1

[profile.dev.package]
helioselene = { opt-level = 3 }
